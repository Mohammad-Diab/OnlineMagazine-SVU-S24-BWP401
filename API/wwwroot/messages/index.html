<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/imgs/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/imgs/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/imgs/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css"
        integrity="sha384-DOXMLfHhQkvFFp+rWTZwVlPVqdIhpDVYT9csOnHSgWQWPX0v5MCGtjCJbY6ERspU" crossorigin="anonymous">
    <link rel="stylesheet" href="../style/fonts.css">
    <link rel="stylesheet" href="../style/style.css">
    <title>ادارة الرسائل</title>
</head>

<body class="" dir="rtl">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../home/">
                <img src="../assets/imgs/logo.svg" alt="Logo" width="auto" height="32" class="me-1">
                <span class="logo-text">مجلتنا</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../home/">الصفحة الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../articles">المقالات</a>
                    </li>
                    <li class="nav-item" id="articlesManagerTab">
                        <a class="nav-link" href="../manager">ادارة المقالات</a>
                    </li>
                    <li class="nav-item" id="messagesManagerTab">
                        <a class="nav-link active" href="../messages">الرسائل</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../about/">من نحن</a>
                    </li>
                </ul>
            </div>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item" id="logoutBtn">
                        <a class="nav-link text-danger" href="#" onclick="logout()">خروج</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div style="min-height: calc(100vh - 120px);" class="container">
        <div class="d-flex justify-content-between mt-3 mb-2">
            <h2 class="m-0">ادارة الرسائل</h2>
        </div>
        <table class="table mt-4 align-middle">
            <thead>
                <tr>
                    <th>معرف</th>
                    <th>اسم المرسل</th>
                    <th>البريد الالكتروني</th>
                    <th>تاريخ الارسال</th>
                    <th>الاجراءات</th>
                </tr>
            </thead>
            <tbody id="messages-table">
                <tr>
                    <td colspan="5" class="text-center">يتم التحميل...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="viewMessageModal" tabindex="-1" aria-labelledby="viewMessageModalLabel"
        aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="viewMessageModalLabel">نص الرسالة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">

                    <div class="mb-3">
                        <label for="messageContent" class="form-label">محتوى الرسالة</label>
                        <textarea id="messageContent" class="form-control" rows="10" placeholder="محتوى الرسالة"
                            readonly></textarea>
                    </div>

                    <div class="text-center">
                        <button type="button" data-bs-dismiss="modal" class="btn btn-primary">اغلاق</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer dir="ltr">
        © 2024 KOD by <a href="https://www.linkedin.com/in/mohammadsalimdiab/" target="_blank">Mohammad</a>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>
    <script src="../script/common.js"></script>
    <script src="../script/messages.js"></script>
</body>

</html>
