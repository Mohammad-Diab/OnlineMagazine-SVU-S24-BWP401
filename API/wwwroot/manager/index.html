<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/imgs/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/imgs/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/imgs/favicon-16x16.png">
    <link rel="manifest" href="../assets/site.webmanifest">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css"
        integrity="sha384-DOXMLfHhQkvFFp+rWTZwVlPVqdIhpDVYT9csOnHSgWQWPX0v5MCGtjCJbY6ERspU" crossorigin="anonymous">
    <link rel="stylesheet" href="../style/fonts.css">
    <link rel="stylesheet" href="../style/style.css">
    <title>ادارة المقالات</title>
</head>

<body class="" dir="rtl">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="../home/">
                <img src="../assets/imgs/logo.svg" alt="Logo" width="auto" height="32" class="me-1">
                <span class="logo-text">مجلتنا</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="../home/">الصفحة الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../articles">المقالات</a>
                    </li>
                    <li class="nav-item" id="articlesManagerTab">
                        <a class="nav-link active" href="../manager">ادارة المقالات</a>
                    </li>
                    <li class="nav-item" id="messagesManagerTab">
                        <a class="nav-link" href="../messages">الرسائل</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../about/">من نحن</a>
                    </li>
                </ul>
            </div>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item" id="logoutBtn">
                        <a class="nav-link text-danger" href="#" onclick="logout()">خروج</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div style="min-height: calc(100vh - 120px);" class="container">
        <div class="d-flex justify-content-between mt-3 mb-2">
            <h2 class="m-0">ادارة المقالات</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addArticleModal">اضافة مقال</button>
        </div>
        <table class="table mt-4 align-middle">
            <thead>
                <tr>
                    <th>معرف</th>
                    <th>العنوان</th>
                    <th>تاريخ الانشاء</th>
                    <th>مرات القراءة</th>
                    <th>الاجراءات</th>
                </tr>
            </thead>
            <tbody id="articles-table">
                <tr>
                    <td colspan="5" class="text-center">يتم التحميل...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="addArticleModal" tabindex="-1" aria-labelledby="addArticleModalLabel" aria-hidden="true"
        data-bs-backdrop="static">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addArticleModalLabel">اضافة مقال</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addProductForm" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="title" class="form-label">عنوان المقال</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="invalid-feedback">هذا الحقل مطلوب</div>
                        <div class="mb-3">
                            <label for="image" class="form-label">الصورة</label>
                            <input type="file" class="form-control" id="image" name="image" required accept="image/*">
                            <div class="invalid-feedback">هذا الحقل مطلوب</div>
                        </div>
                        <hr />
                        <div style="display: flex; justify-content: space-between;">
                            <h4>الفقرات</h4>
                            <button type="button" class="btn btn-primary" onclick="addParagraph()">اضافة فقرة</button>
                        </div>
                        <hr />
                        <div id="paragraphes" style="max-height: min(calc(100vh - 420px), 640px); overflow-y: auto;">
                            <div id="paragraph-0">
                                <div class="mb-3">
                                    <label for="p0-title" class="form-label">عنوان الفقرة</label>
                                    <input type="text" class="form-control" id="p0-title" name="p0-title">
                                </div>
                                <div class="mb-3">
                                    <label for="p0-content" class="form-label">النص</label>
                                    <textarea class="form-control" id="p0-content" name="p0-content"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="p0-image" class="form-label">الصورة</label>
                                    <input type="file" class="form-control" id="p0-image" name="p0-image"
                                        accept="image/*">
                                </div>
                                <button type="button" class="btn btn-danger d-block" style="margin-right: auto;"
                                    onclick="removeParagraph(0)">حذف
                                    فقرة</button>
                                <hr />
                            </div>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">اضافة</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer dir="ltr">
        © 2024 KOD by <a href="https://www.linkedin.com/in/mohammadsalimdiab/" target="_blank">Mohammad</a>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>
    <script src="../script/common.js"></script>
    <script src="../script/manager.js"></script>
</body>

</html>
